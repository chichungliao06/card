<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷哪張">
<title>刷哪張</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1b1f24; --sub:#5f6b7a; --line:#e3e6ea;
  --brand:#14213d; --accent:#e85d04; --good:#2a9d8f; --warn:#d62828; --chip:#eef1f5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --sub:#9aa4b2; --line:#2a2f37; --brand:#9db4ff; --chip:#232831; }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:10px 16px calc(0px);padding-top:max(10px,env(safe-area-inset-top))}
@media (prefers-color-scheme: dark){ header{background:#1d2433} }
header h1{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header h1 small{font-weight:400;font-size:12px;opacity:.75}
nav{display:flex;gap:4px}
nav button{flex:1;background:transparent;border:0;color:#fff;opacity:.7;padding:8px 0 10px;font-size:15px;border-bottom:3px solid transparent}
nav button.on{opacity:1;border-bottom-color:var(--accent);font-weight:600}
nav .badge{background:var(--accent);border-radius:9px;padding:0 6px;font-size:11px;margin-left:3px}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:8px;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;gap:8px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.searchbox{position:relative;flex:1}
.sugg{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:4;max-height:320px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.sugg div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:0}
.sugg small{color:var(--sub);margin-left:6px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line)}
.rank{display:flex;align-items:flex-start;gap:12px}
.rank .no{font-weight:700;color:var(--sub);width:18px;padding-top:2px}
.rank .main{flex:1;min-width:0}
.rank .pct{text-align:right;min-width:78px}
.pct b{font-size:22px;color:var(--accent)}
.pct .net{display:block;font-size:12px;color:var(--sub)}
.cardname{font-weight:600}
.holder{font-size:12px;color:var(--sub);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--sub)}
.chip.plan{background:#fff3e0;color:#b45309}
.chip.reg{background:#fde2e1;color:var(--warn);font-weight:600}
.chip.ok{background:#dcf2ee;color:var(--good)}
.chip.full{background:#fde2e1;color:var(--warn)}
.chip.todo{background:#fff8d6;color:#8a6d00}
@media (prefers-color-scheme: dark){ .chip.plan{background:#3a2a12;color:#f5b25e}.chip.reg,.chip.full{background:#3b1717;color:#ff8a80}.chip.ok{background:#12302b;color:#6fd3c3}.chip.todo{background:#33300f;color:#e6cf5a} }
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.hi{background:var(--accent)} .bar i.full{background:var(--warn)}
.meta{font-size:12px;color:var(--sub)}
details{margin-top:6px} summary{font-size:13px;color:var(--sub);cursor:pointer}
details p{margin:4px 0;font-size:13px;color:var(--sub)}
.btn{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{background:var(--warn)}
@media (prefers-color-scheme: dark){ .btn{background:#3b5bdb} }
h2{font-size:15px;margin:18px 0 6px;color:var(--sub);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item .l{min-width:0;flex:1}
.list .item .r{text-align:right;white-space:nowrap}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1;pointer-events:auto}
.toast{pointer-events:none;display:flex;align-items:center;gap:12px;white-space:nowrap}
.toast .undo{background:transparent;border:1px solid #fff;color:#ffd166;border-radius:7px;padding:3px 10px;font-size:13px;cursor:pointer}
.login{max-width:420px;margin:40px auto}
.hint{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>刷哪張 <small id="syncInfo"></small></h1>
  <nav id="nav">
    <button data-tab="rec" class="on">推薦</button>
    <button data-tab="tx">記帳</button>
    <button data-tab="todo">待辦<span class="badge" id="todoBadge" hidden></span></button>
    <button data-tab="cards">卡片</button>
  </nav>
</header>
<main id="app"></main>

<dialog id="txDlg"><form method="dialog" id="txForm"></form></dialog>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
